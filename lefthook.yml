# Scaffold Product hooks. Generated apps ship their own lefthook.yml.
pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      exclude:
        - repos/**
        - "**/node_modules/**"
      run: |
        set -eu
        # Lefthook substitutes {staged_files} as a space-separated list.
        # Feed paths through NUL xargs so they are never executed as shell commands.
        files="{staged_files}"
        if [ -z "${files}" ]; then
          exit 0
        fi
        # shellcheck disable=SC2086 -- intentional split of Lefthook's space-separated list
        cli=$(printf '%s\n' ${files} | grep '^apps/cli/' || true)
        generator=$(printf '%s\n' ${files} | grep '^packages/template-generator/' || true)
        if [ -n "${cli}" ]; then
          printf '%s\n' "${cli}" | tr '\n' '\0' | xargs -0 bunx oxlint -c apps/cli/.oxlintrc.json --fix --deny-warnings
        fi
        if [ -n "${generator}" ]; then
          printf '%s\n' "${generator}" | tr '\n' '\0' | xargs -0 bunx oxlint -c packages/template-generator/.oxlintrc.json --fix --deny-warnings
        fi
      stage_fixed: true
    dprint:
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: |
        set -eu
        bunx dprint fmt {staged_files}
      stage_fixed: true

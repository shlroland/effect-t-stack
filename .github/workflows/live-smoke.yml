name: live-smoke

# Gated Live tier: create --yes from templates → install → check-types.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Scaffold Product
        run: bun install --frozen-lockfile

      - name: Live create + typecheck
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          (
            cd "$WORK"
            bun "$GITHUB_WORKSPACE/apps/cli/src/bin.ts" live-smoke --yes --no-git --no-render-title
          )
          TARGET="$WORK/live-smoke"
          test -f "$TARGET/package.json"
          bun run --cwd "$TARGET" check-types

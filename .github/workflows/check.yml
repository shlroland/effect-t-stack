name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Scaffold Product
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test (CLI + template generator + effect-oxc)
        run: bun run check

      - name: Generated-build (template generator default stack)
        run: ETS_GENERATED_BUILD=1 bun test packages/template-generator/test/generated-build.test.ts

      - name: Generated-build (create --yes via template generator)
        run: ETS_GENERATED_BUILD=1 bun test apps/cli/test/generated-build.smoke.test.ts

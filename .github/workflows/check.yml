name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Scaffold Product
        run: bun install --frozen-lockfile

      - name: Install Golden Sample
        run: bun install --frozen-lockfile --cwd examples/golden

      - name: Lint, typecheck, test (CLI + Golden)
        run: bun run check

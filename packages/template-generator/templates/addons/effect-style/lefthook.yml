# Git hooks for effect-style (dprint + oxlint). See ets.jsonc → addonOptions.effect-style.
pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint -c .oxlintrc.json --fix --deny-warnings {staged_files}
      stage_fixed: true
    dprint:
      glob: "*.{ts,tsx,js,jsx,json,md}"
      run: bunx dprint fmt {staged_files}
      stage_fixed: true
